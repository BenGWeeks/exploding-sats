<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Exploding Sats - pixel-art karate fist with Bitcoin-orange burst -->
  <rect fill="#000000" x="0" y="0" width="32" height="32"/>
  <!-- Burst rays (Bitcoin orange) -->
  <rect fill="#f7931a" x="4" y="4" width="2" height="2"/>
  <rect fill="#f7931a" x="26" y="4" width="2" height="2"/>
  <rect fill="#f7931a" x="15" y="1" width="2" height="3"/>
  <rect fill="#f7931a" x="1" y="15" width="3" height="2"/>
  <rect fill="#f7931a" x="28" y="15" width="3" height="2"/>
  <rect fill="#f7931a" x="4" y="26" width="2" height="2"/>
  <rect fill="#f7931a" x="26" y="26" width="2" height="2"/>
  <rect fill="#f7931a" x="15" y="28" width="2" height="3"/>
  <rect fill="#ffd45c" x="6" y="6" width="2" height="2"/>
  <rect fill="#ffd45c" x="24" y="6" width="2" height="2"/>
  <rect fill="#ffd45c" x="6" y="24" width="2" height="2"/>
  <rect fill="#ffd45c" x="24" y="24" width="2" height="2"/>
  <!-- Wrist / gi sleeve (white) -->
  <rect fill="#ffffff" x="8" y="18" width="6" height="8"/>
  <!-- Fist (skin) -->
  <rect fill="#e8a870" x="12" y="8" width="12" height="14"/>
  <rect fill="#e8a870" x="10" y="12" width="2" height="8"/>
  <!-- Knuckle shading -->
  <rect fill="#b87a48" x="12" y="8" width="12" height="2"/>
  <rect fill="#b87a48" x="15" y="10" width="1" height="4"/>
  <rect fill="#b87a48" x="18" y="10" width="1" height="4"/>
  <rect fill="#b87a48" x="21" y="10" width="1" height="4"/>
  <!-- Finger fold lines -->
  <rect fill="#b87a48" x="12" y="15" width="12" height="1"/>
  <rect fill="#b87a48" x="12" y="18" width="12" height="1"/>
  <!-- Thumb -->
  <rect fill="#e8a870" x="12" y="20" width="10" height="3"/>
  <rect fill="#b87a48" x="12" y="22" width="10" height="1"/>
</svg>
